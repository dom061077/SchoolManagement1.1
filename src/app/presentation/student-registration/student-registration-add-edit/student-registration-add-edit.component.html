<h2 mat-dialog-title>{{title}}</h2>
<mat-dialog-content>
  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <ng-select [items]="studentData()" [searchable]="true" appendTo=".select-wrapper" bindLabel="dniLastNameFirstName"
        bindValue="id" appendTo="body" class="material-style-select" dropdownPosition="bottom"
        placeholder="{{'COMMON.SELECT_STUDENT' | translate}}" formControlName="studentId" required>
      </ng-select>
      <ng-select [items]="academicYearData()" [searchable]="true" appendTo=".select-wrapper" bindLabel="year"
        bindValue="id" appendTo="body" class="material-style-select" dropdownPosition="bottom"
        placeholder="{{'ACADEMIC_YEAR.ID' | translate}}" formControlName="academicYearId" required>
      </ng-select>

      <div class="col-md-12">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>{{'GRADE_LEVEL.ID' | translate}}</mat-label>
          <input matInput formControlName="gradeLevelId" type="number" required>
        </mat-form-field>
      </div>

      <ng-select [items]="shiftData()" [searchable]="true" appendTo=".select-wrapper" bindLabel="name" bindValue="id"
        appendTo="body" class="material-style-select" dropdownPosition="bottom"
        placeholder="{{'COMMON.SELECT_SHIFT' | translate}}" formControlName="shiftId" required>
      </ng-select>

      <div class="col-md-12">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>{{'SECTION.ID' | translate}}</mat-label>
          <input matInput formControlName="sectionId" type="number" required>
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{'COMMON.CANCEL' | translate}}</button>
  <button mat-raised-button color="primary" [disabled]="!registrationForm.valid || readonly"
    (click)="onSubmit()">{{'COMMON.SAVE' | translate}}</button>
</mat-dialog-actions>
